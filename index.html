<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9e2b25">
<title>Nuestro diario · Perú</title>
<style>
  :root{
    --ink:#2a1d14; --ink-soft:#7a6a57; --paper:#f3ebdc; --card:#fcf8ef;
    --terra:#a5302a; --terra-d:#83231e; --ochre:#cf962b; --teal:#1f7a6b;
    --line:#e0d2b6;
    --shadow:0 1px 2px rgba(42,29,20,.06),0 10px 30px rgba(42,29,20,.08);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-bottom:110px}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}
  header{padding:20px 0 10px}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ochre);font-weight:800;margin:0}
  .trip-title{font-family:var(--serif);font-size:clamp(26px,8vw,38px);margin:6px 0 12px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{grid-column:1/-1}
  label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;display:block;margin-bottom:5px}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  .field{margin-bottom:0}
  .notice{font-size:12.5px;color:var(--ink-soft);background:var(--card);border:1px dashed var(--ochre);border-radius:12px;padding:10px 12px;margin-bottom:14px}

  .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
  .day-chip{flex:0 0 auto;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:13px}
  .day-chip.active{border-color:var(--terra);box-shadow:0 0 0 2px rgba(165,48,42,.16)}
  .day-chip b{display:block;font-family:var(--serif);font-size:14.5px}
  .day-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block;margin-right:5px}
  .day-chip .dot.saved{background:var(--teal)}
  .addchip{border:1px dashed var(--ochre);color:var(--terra);background:none;border-radius:12px;min-width:44px;font-size:22px;cursor:pointer}

  .q{margin-top:14px}
  .qlabel{font-family:var(--serif);font-size:15.5px;font-weight:700;margin-bottom:3px}
  .qhint{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:8px 13px;font-size:13.5px;cursor:pointer;min-height:38px}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
  .chip.on.mood{background:var(--terra);border-color:var(--terra)}

  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{font-family:inherit;font-size:14px;font-weight:700;border-radius:11px;padding:12px 14px;cursor:pointer;border:1px solid transparent;min-height:46px}
  .btn-primary{background:var(--terra);color:#fff;border-color:var(--terra);flex:1}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn-del{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer}

  .toolbar{position:fixed;left:0;right:0;bottom:0;background:rgba(252,248,239,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
  .toolbar .btn{flex:1}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .save-state{font-size:11.5px;color:var(--ink-soft);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Cuaderno de viaje</p>
    <h1 class="trip-title" id="bigTitle">Perú 2026</h1>
  </header>

  <div class="notice">
    Este cuaderno guarda un borrador mientras escribes, pero lo que de verdad cuenta es el <b>archivo que descargas</b> al terminar cada día. Sin fotos aquí dentro — usa el Carrete del móvil para eso, y anota abajo cuáles destacar.
  </div>

  <div class="card">
    <div class="setup-grid">
      <div class="field full"><label>Título del viaje</label><input id="tName" placeholder="Perú 2026"></div>
      <div class="field"><label>Nombre 1</label><input id="tA" placeholder="Tú"></div>
      <div class="field"><label>Nombre 2</label><input id="tB" placeholder="Tu pareja"></div>
      <div class="field full"><label>Estilo del relato</label>
        <select id="tStyle">
          <option value="cálido y personal, con cariño">Cálido y personal</option>
          <option value="divertido y desenfadado">Divertido y desenfadado</option>
          <option value="literario y evocador">Literario y evocador</option>
          <option value="sobrio, estilo diario de viaje">Sobrio, tipo diario</option>
        </select>
      </div>
    </div>
    <div class="save-state" id="saveTxt"></div>
  </div>

  <div class="strip" id="strip"></div>
  <main id="main"></main>
</div>

<div class="toolbar">
  <button class="btn btn-ghost" id="btnSeed">Cargar ruta</button>
  <button class="btn btn-primary" id="btnSaveDay">Guardar día en archivo ↓</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};

var LOCATIONS=["Lima","Arequipa","Cañón del Colca","Cusco","Valle Sagrado","Aguas Calientes / Machu Picchu","En ruta","Otro"];
var MOODS=["Increíble","Tranquilo","Aventurero","Emotivo","Agotador","Romántico"];
var WEATHER=["Sol","Nubes","Lluvia","Frío","Calor","Altura"];
var QUESTIONS=[
  {k:"title",t:"El día en una frase",h:"Vuestro titular de hoy",type:"text",lbl:"titular"},
  {k:"did",t:"¿Qué hicimos?",h:"Las actividades, en orden",type:"area",lbl:"que_hicimos"},
  {k:"best",t:"El momento del día",h:"Lo que recordaréis",type:"area",lbl:"momento_del_dia"},
  {k:"surprise",t:"Lo inesperado",h:"Algo que no veíais venir",type:"area",lbl:"lo_inesperado"},
  {k:"quote",t:"Frase del día",h:"Algo textual que dijo uno de los dos",type:"text",lbl:"frase_del_dia"},
  {k:"food",t:"Lo que comimos",h:"Platos, sitios, bebidas",type:"area",lbl:"comida"},
  {k:"people",t:"Quién apareció",h:"Gente que conocisteis",type:"area",lbl:"gente"},
  {k:"anecdote",t:"La anécdota",h:"Lo gracioso, raro o absurdo",type:"area",lbl:"anecdota"},
  {k:"learned",t:"Algo que aprendimos",h:"Un dato, una palabra, una idea",type:"text",lbl:"aprendimos"},
  {k:"landscape",t:"El paisaje",h:"Qué veíais, cómo era la luz",type:"area",lbl:"paisaje"},
  {k:"stay",t:"Dónde dormimos",h:"Alojamiento y qué tal estuvo",type:"text",lbl:"alojamiento"},
  {k:"transport",t:"Cómo nos movimos",h:"Bus, tren, taxi, a pie…",type:"text",lbl:"transporte"},
  {k:"body",t:"Cómo estaba el cuerpo",h:"Cansancio, altura, sueño",type:"text",lbl:"estado_fisico"},
  {k:"gratitude",t:"Algo que agradecimos",h:"Un gesto, una ayuda, un golpe de suerte",type:"area",lbl:"agradecimos"},
  {k:"missed",t:"Lo que echamos de menos",h:"De casa, de la rutina, opcional",type:"text",lbl:"echamos_de_menos"},
  {k:"repeat",t:"Repetiríamos / no repetiríamos",h:"Para el próximo viaje",type:"area",lbl:"repetiriamos"},
  {k:"photos",t:"Fotos a destacar",h:"Cuáles del Carrete usar hoy (hora, o breve descripción)",type:"area",lbl:"fotos_destacadas"},
  {k:"spend",t:"Gasto destacado",h:"Opcional",type:"text",lbl:"gasto"},
  {k:"notes",t:"Notas sueltas",h:"Detalles para no olvidar",type:"area",lbl:"notas"}
];

var KEY="diario_peru_v3";
function uid(){return "d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function blankDay(loc){var d={id:uid(),location:loc||"",mood:"",weather:[],savedAt:null};QUESTIONS.forEach(function(q){d[q.k]="";});return d;}
function loadState(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
var state=loadState()||{trip:{name:"Perú 2026",a:"",b:"",style:"cálido y personal, con cariño"},days:[blankDay("")],current:null};
if(!state.days||!state.days.length)state.days=[blankDay("")];
if(!state.current||!state.days.some(function(d){return d.id===state.current;}))state.current=state.days[0].id;

var saveTimer=null;
function save(){
  state.trip={name:($("#tName").value.trim()||"Mi viaje"),a:$("#tA").value.trim(),b:$("#tB").value.trim(),style:$("#tStyle").value};
  try{localStorage.setItem(KEY,JSON.stringify(state));flag();}catch(e){$("#saveTxt").textContent="No se pudo guardar el borrador — descarga el archivo del día para no perder nada.";}
}
function queueSave(){clearTimeout(saveTimer);$("#saveTxt").textContent="Guardando borrador…";saveTimer=setTimeout(save,400);}
function flag(){var d=new Date();$("#saveTxt").textContent="Borrador guardado "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" — recuerda descargar el archivo del día";}
function curDay(){return state.days.find(function(d){return d.id===state.current;});}
function isWritten(d){if(d.mood||(d.weather&&d.weather.length))return true;return QUESTIONS.some(function(q){return d[q.k]&&String(d[q.k]).trim();});}
function nameA(){return ($("#tA").value.trim())||"Persona 1";}
function nameB(){return ($("#tB").value.trim())||"Persona 2";}
function dayIndex(d){return state.days.indexOf(d);}

function renderHeader(){
  $("#tName").value=state.trip.name||"";$("#bigTitle").textContent=state.trip.name||"Perú 2026";
  $("#tA").value=state.trip.a||"";$("#tB").value=state.trip.b||"";$("#tStyle").value=state.trip.style||"cálido y personal, con cariño";
}
function renderStrip(){
  var strip=$("#strip");strip.innerHTML="";
  state.days.forEach(function(d,i){
    var c=el("div","day-chip"+(d.id===state.current?" active":""));
    var loc=d.location||"Día "+(i+1);
    c.innerHTML='<span><span class="dot'+(d.savedAt?" saved":"")+'"></span>Día '+(i+1)+'</span><b>'+loc+'</b>';
    c.onclick=function(){state.current=d.id;renderDay();renderStrip();};
    strip.appendChild(c);
  });
  var add=el("button","addchip","+");
  add.onclick=function(){var d=blankDay("");state.days.push(d);state.current=d.id;save();renderDay();renderStrip();};
  strip.appendChild(add);
}
function chipGroup(label,options,val,mode,onClick){
  var w=el("div","q");w.appendChild(el("div","qlabel",label));
  var box=el("div","chips");
  options.forEach(function(o){
    var on=mode==="multi"?(val||[]).indexOf(o)>=0:val===o;
    var c=el("button","chip"+(on?" on"+(mode==="mood"?" mood":""):""),o);
    c.type="button";c.onclick=function(){onClick(o);};box.appendChild(c);
  });
  w.appendChild(box);return w;
}
function renderDay(){
  var main=$("#main");main.innerHTML="";var d=curDay();if(!d)return;
  var card=el("div","card");
  var locSel=el("select");
  LOCATIONS.forEach(function(l){var o=el("option");o.value=l;o.textContent=l;if(l===d.location)o.selected=true;locSel.appendChild(o);});
  locSel.onchange=function(){d.location=locSel.value;queueSave();renderStrip();};
  var locWrap=el("div","field");locWrap.appendChild(el("label",null,"Lugar"));locWrap.appendChild(locSel);
  card.appendChild(locWrap);
  card.appendChild(chipGroup("¿Qué tal el día?",MOODS,d.mood,"mood",function(v){d.mood=(d.mood===v?"":v);queueSave();renderDay();}));
  card.appendChild(chipGroup("El tiempo",WEATHER,d.weather,"multi",function(v){d.weather=d.weather||[];var i=d.weather.indexOf(v);if(i>=0)d.weather.splice(i,1);else d.weather.push(v);queueSave();renderDay();}));

  QUESTIONS.forEach(function(q){
    var w=el("div","q");w.appendChild(el("div","qlabel",q.t));
    if(q.h)w.appendChild(el("div","qhint",q.h));
    var inp=q.type==="area"?el("textarea"):el("input");if(q.type!=="area")inp.type="text";
    inp.value=d[q.k]||"";inp.placeholder="…";
    inp.oninput=function(){d[q.k]=inp.value;queueSave();renderStrip();};
    w.appendChild(inp);card.appendChild(w);
  });

  var btnrow=el("div","btnrow");
  var delBtn=el("button","btn-del","Eliminar este día");
  delBtn.onclick=function(){
    if(state.days.length<=1){toast("Debe quedar al menos un día");return;}
    if(!confirm("¿Eliminar este día?"))return;
    var i=dayIndex(d);state.days.splice(i,1);state.current=state.days[Math.max(0,i-1)].id;save();renderAll();
  };
  btnrow.appendChild(delBtn);
  card.appendChild(btnrow);
  main.appendChild(card);
}
function renderAll(){renderHeader();renderStrip();renderDay();}

function download(name,content){
  var blob=new Blob([content],{type:"text/plain;charset=utf-8"});var a=el("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},100);
}
function slug(s){return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"_").replace(/^_+|_+$/g,"");}

function dayText(d,i){
  var lines=[];
  lines.push("DÍA "+(i+1)+" — "+(d.location||"Sin lugar"));
  lines.push("Viaje: "+(state.trip.name||"")+" · "+nameA()+" & "+nameB());
  lines.push("");
  if(d.mood)lines.push("Ánimo: "+d.mood);
  if(d.weather&&d.weather.length)lines.push("Tiempo: "+d.weather.join(", "));
  lines.push("");
  QUESTIONS.forEach(function(q){
    if(d[q.k]&&String(d[q.k]).trim()){lines.push(q.t.toUpperCase()+":");lines.push(String(d[q.k]).trim());lines.push("");}
  });
  return lines.join("\n");
}

function dayPrompt(d,i){
  var json=JSON.stringify({
    viaje:state.trip.name,viajeros:[nameA(),nameB()],dia:i+1,lugar:d.location,
    animo:d.mood||undefined,tiempo:(d.weather&&d.weather.length)?d.weather:undefined,
    notas:(function(){var o={};QUESTIONS.forEach(function(q){if(d[q.k]&&String(d[q.k]).trim())o[q.lbl]=String(d[q.k]).trim();});return o;})()
  },null,2);
  return [
"Eres un escritor de viajes con un estilo "+state.trip.style+". Escribe el capítulo de UN SOLO DÍA de nuestro viaje a Perú a partir de estas notas de diario de pareja. Viajamos "+nameA()+" y "+nameB()+".","",
"QUÉ QUIERO",
"1. Escribe en español, en primera persona del plural (nosotros), con cariño.",
"2. Empieza con un título evocador, y debajo la fecha/lugar.",
"3. Tono: "+state.trip.style+". Sé FIEL a las notas: no inventes hechos, nombres, lugares ni cifras.",
"4. Extensión orientativa: 150-250 palabras.",
"5. Si hay 'fotos_destacadas', sugiere al final entre corchetes dónde irían.",
"6. Devuelve solo el capítulo, listo para pegar en el libro.","",
"NOTAS DEL DÍA (JSON)",json
  ].join("\n");
}

function fullPrompt(){
  var days=state.days.filter(isWritten);
  var clean=days.map(function(d){var i=dayIndex(d);
    var o={dia:i+1,lugar:d.location};
    if(d.mood)o.animo=d.mood;if(d.weather&&d.weather.length)o.tiempo=d.weather;
    QUESTIONS.forEach(function(q){if(d[q.k]&&String(d[q.k]).trim())o[q.lbl]=String(d[q.k]).trim();});
    return o;
  });
  var json=JSON.stringify({viaje:state.trip.name,viajeros:[nameA(),nameB()],dias:clean},null,2);
  return [
"Eres un escritor de viajes con un estilo "+state.trip.style+". Escribe el relato completo de nuestro viaje a Perú a partir de estas notas de diario de pareja. Viajamos "+nameA()+" y "+nameB()+".","",
"QUÉ QUIERO",
"1. Español, primera persona del plural, con cariño.",
"2. Un capítulo por día, en orden, con título evocador, fecha y lugar.",
"3. Tono: "+state.trip.style+". FIEL a las notas, sin inventar.",
"4. 150-250 palabras por día.",
"5. Si hay fotos_destacadas, sugiérelas entre corchetes al final de cada capítulo.",
"6. Cierra con un breve epílogo.",
"7. Devuelve solo el relato.","",
"NOTAS (JSON)",json
  ].join("\n");
}

var tt=null;function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2000);}

$("#tName").oninput=function(){$("#bigTitle").textContent=$("#tName").value||"Mi viaje";queueSave();};
$("#tA").oninput=queueSave;$("#tB").oninput=queueSave;$("#tStyle").onchange=queueSave;

$("#btnSeed").onclick=function(){
  var route=["Lima","Lima","Arequipa","Arequipa","Cañón del Colca","Cusco","Valle Sagrado","Aguas Calientes / Machu Picchu","Cusco"];
  var oneBlank=state.days.length===1&&!isWritten(state.days[0]);
  if(!oneBlank&&!confirm("Añadirá los días de la ruta a los que ya tienes. ¿Seguimos?"))return;
  if(oneBlank)state.days=[];
  route.forEach(function(L){state.days.push(blankDay(L));});
  state.current=state.days[0].id;save();renderAll();toast("Ruta cargada");
};

$("#btnSaveDay").onclick=function(){
  save();var d=curDay();if(!d)return;
  if(!isWritten(d)){toast("Escribe algo del día primero");return;}
  var i=dayIndex(d);d.savedAt=Date.now();save();renderStrip();
  var base=(state.trip.name?slug(state.trip.name)+"_":"")+"Dia_"+String(i+1).padStart(2,"0")+"_"+slug(d.location||"lugar");
  download(base+"_notas.txt",dayText(d,i));
  setTimeout(function(){download(base+"_prompt_IA.txt",dayPrompt(d,i));toast("2 archivos descargados: notas + prompt IA");},400);
};

// botón extra: relato completo, añadido en la cabecera como enlace de texto
(function(){
  var wrap=el("div","btnrow");
  var b=el("button","btn btn-ghost","Generar relato completo (todos los días)");
  b.style.width="100%";
  b.onclick=function(){
    save();if(!state.days.filter(isWritten).length){toast("Escribid al menos un día primero");return;}
    download((slug(state.trip.name||"viaje"))+"_relato_completo_IA.txt",fullPrompt());
    toast("Prompt completo descargado");
  };
  wrap.appendChild(b);
  $(".wrap").insertBefore(wrap,$("#strip").previousElementSibling.nextSibling);
})();

renderAll();flag();
})();
</script>
</body>
</html>
